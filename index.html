<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>خدمة يوحنا المعمدان</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A4A;--navy2:#1B4370;--sky:#8EC9F0;--mist:#E6F3FC;--bg:#F3F8FC;--card:#fff;--ink:#12263F;--mute:#5F7691;--line:#D5E4F1;--ok:#1F8A5B;--bad:#C2413A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A2E;--card:#12294A;--ink:#E8F2FB;--mute:#93AFCB;--line:#26456B;--mist:#17335A}}
:root[data-theme="dark"]{--bg:#0A1A2E;--card:#12294A;--ink:#E8F2FB;--mute:#93AFCB;--line:#26456B;--mist:#17335A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6;padding-bottom:84px}
header{background:var(--navy);color:#fff;padding:16px 16px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px;font-weight:700}
header small{color:var(--sky)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{background:var(--navy);color:#fff;border:0}
.big .n{font-size:32px;font-weight:700;color:var(--sky)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--mist);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px}.stat span{color:var(--mute);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 2px;color:var(--mute);font:inherit;font-size:11.5px}
nav button.on{color:var(--navy2);font-weight:700;box-shadow:inset 0 3px 0 var(--sky)}
@media (prefers-color-scheme:dark){nav button.on{color:var(--sky)}}
button.b,a.b{background:var(--navy2);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none}
button.l{background:var(--mist);color:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
button.d{background:none;color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--mist);color:var(--navy2)}
.tag.bad{background:#fbe3e1;color:var(--bad)}.tag.ok{background:#dcf3e8;color:var(--ok)}
.loan{display:flex;gap:12px}
.loan img,.ph{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--mist);flex:none}
.bar{height:8px;background:var(--mist);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--navy2)}
.modal{position:fixed;inset:0;background:rgba(10,26,46,.6);z-index:20;overflow:auto;padding:14px}
.modal>div{background:var(--bg);max-width:560px;margin:0 auto;border-radius:16px;padding:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
h2{font-size:17px;margin:4px 0 10px}
.center{text-align:center;padding:40px 14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
// ---------- التخزين ----------
var KEY='loan_tracker_v1', mem=null;
function blank(){return{pin:'1234',loans:[],fund:[]}}
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||blank()}
var ON=!!window.API_URL;var D=ON?{loans:[],queue:[],fund:[],msg:''}:load();D.queue=D.queue||[];D.fund=D.fund||[];
var SNAP={loans:{},queue:{},fund:{},msg:''},ROLE=ON?null:'admin',PIN='',CH=Promise.resolve(),T=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ensureIds(){['loans','queue','fund'].forEach(function(c){(D[c]||[]).forEach(function(r){if(!r.id)r.id=uid()})})}
ensureIds();
function api(a,x){x=x||{};x.a=a;x.pin=PIN;return fetch(window.API_URL,{method:'POST',body:JSON.stringify(x)}).then(function(r){return r.json()})}
function snap(){['loans','queue','fund'].forEach(function(c){SNAP[c]={};D[c].forEach(function(r){SNAP[c][r.id]=JSON.stringify(r)})});SNAP.msg=D.msg||''}
function busy(){var e=document.activeElement;return S.modal||(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName))}
function pull(){return api('get').then(function(r){if(!r.ok)throw 0;D.loans=r.loans||[];D.queue=(r.queue||[]).sort(function(a,b){return N(a.pos)-N(b.pos)});D.fund=r.fund||[];D.msg=r.msg||'';snap();if(S.mode&&!busy())render()}).catch(function(){toast('تعذر تحديث البيانات')})}
function push(){var ops=[];D.queue.forEach(function(q,i){q.pos=String(i)});
  ['loans','queue','fund'].forEach(function(c){var cur={};D[c].forEach(function(r){cur[r.id]=JSON.stringify(r)});
    D[c].forEach(function(r){if(SNAP[c][r.id]!==cur[r.id])ops.push({c:c,t:'up',r:r})});
    Object.keys(SNAP[c]).forEach(function(id){if(!(id in cur))ops.push({c:c,t:'del',id:id})});SNAP[c]=cur});
  if((D.msg||'')!==SNAP.msg){ops.push({c:'msg',v:D.msg||''});SNAP.msg=D.msg||''}
  if(!ops.length)return;
  CH=CH.then(function(){return api('sync',{ops:ops})}).then(function(r){if(!r.ok){toast('لم يتم الحفظ');pull()}}).catch(function(){toast('لا يوجد اتصال، لم يتم الحفظ');pull()})}
function saveSoon(){clearTimeout(T);T=setTimeout(save,900)}
function save(){ensureIds();if(ON){push();return}mem=D;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('تعذر الحفظ على الجهاز، خدي نسخة احتياطية')}}

// ---------- أدوات ----------
var AM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function N(x){return Number(x)||0}
function money(x){return Math.round(N(x)).toLocaleString('en-US')+' ج.م'}
function ym(s){var p=String(s||'').split('-');return p.length<2?null:(+p[0])*12+(+p[1]-1)}
function ymStr(v){return Math.floor(v/12)+'-'+String(v%12+1).padStart(2,'0')}
function ymLabel(s){var v=ym(s);return v==null?'—':AM[v%12]+' '+Math.floor(v/12)}
var now=new Date(), CUR=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function planOf(l){var p=l.paid&&l.paid._plan;return(Array.isArray(p)&&p.length)?p:null}
function sched(l){
  var tot=N(l.total),m=N(l.monthly),plan=planOf(l),out=[],left=tot,i;
  if(plan&&plan[0].length===3){var st0=ym(l.start);if(st0==null||m<=0)return[];
    for(i=0;left>0.001&&i<600;i++){var kk=st0+i,aa=m;plan.forEach(function(r){if(kk>=ym(r[0])&&kk<=ym(r[1])&&N(r[2])>0)aa=N(r[2])});var xx=Math.min(aa,left);out.push(xx);left-=xx}
    return out}
  if(!plan){if(m<=0)return[];var n=Math.ceil(tot/m);for(i=0;i<n;i++)out.push(i===n-1?tot-(n-1)*m:m);return out}
  for(var s=0;s<plan.length&&left>0.001;s++){var c=Math.floor(N(plan[s][0])),a=N(plan[s][1]);if(a<=0)continue;var last=(s===plan.length-1),k=0;
    while(left>0.001&&(last||k<c)&&out.length<600){var x=Math.min(a,left);out.push(x);left-=x;k++}}
  return out
}
function expAt(l,k){var st=ym(l.start),i=ym(k)-st,S_=sched(l);return(st!=null&&i>=0&&i<S_.length)?S_[i]:N(l.monthly)}
function expDue(l,k){var st=ym(l.start),i=ym(k)-st,S_=sched(l);return(st!=null&&i>=0&&i<S_.length)?S_[i]:0}
function pAmt(l,k){var v=l.paid&&l.paid[k];if(!v)return 0;var x=String(v),i=x.indexOf(':');return i>0?N(x.slice(i+1)):expAt(l,k)}
function planText(l){var p=planOf(l);if(!p)return money(l.monthly);
  if(p[0].length===3)return p.map(function(r){return Math.round(N(r[2])).toLocaleString('en-US')+' ('+(r[0]===r[1]?ymLabel(r[0]):ymLabel(r[0])+' – '+ymLabel(r[1]))+')'}).join('، ')+'، والباقي '+Math.round(N(l.monthly)).toLocaleString('en-US')+' ج.م';
  return p.map(function(x,i){var a=Math.round(N(x[1])).toLocaleString('en-US');return i<p.length-1?a+' × '+Math.floor(N(x[0]))+' شهر':(p.length>1?'ثم ':'')+a+' ج.م'}).join('، ')}
function planForm(l){var p=planOf(l)||[],nl=[];
  if(p.length&&p[0].length===3){var cur=ym(l.start);p.slice().sort(function(a,b){return ym(a[0])-ym(b[0])}).forEach(function(r){if(cur!=null&&ym(r[0])===cur){var c=ym(r[1])-ym(r[0])+1;nl.push([c,N(r[2])]);cur+=c}else cur=null})}
  else nl=p.slice(0,-1);
  var a=nl[0]||['',''],b=nl[1]||['',''];
  function f(id,v,lb){return'<div><label>'+lb+'</label><input id="'+id+'" type="number" inputmode="numeric" value="'+esc(v)+'"></div>'}
  return'<div class="card" style="margin:10px 0"><b>أقساط مختلفة حسب الشهر (اختياري)</b><p style="color:var(--mute);margin:4px 0">لو القسط مش ثابت: حددي أول عدد من الشهور بمبلغ، وباقي الشهور بالمبلغ المكتوب في خانة «القسط الشهري».</p><div class="grid">'+
  f('f_p1c',a[0],'أول كام شهر')+f('f_p1a',a[1],'بمبلغ (ج.م)')+f('f_p2c',b[0],'بعدهم كام شهر')+f('f_p2a',b[1],'بمبلغ (ج.م)')+'</div></div>'}
function plan_(o,segs){if(segs.length)o.paid._plan=segs.concat([[0,o.monthly]]);else delete o.paid._plan}
function lastMonth(l){var n=sched(l).length,st=ym(l.start);return(n&&st!=null)?ymLabel(ymStr(st+n-1)):'—'}
function calc(l,curStr){
  var cur=ym(curStr||CUR),st=ym(l.start),S_=sched(l),n=S_.length;
  var due=st==null?0:Math.max(0,Math.min(n,cur-st+1));
  var paidSum=0;Object.keys(l.paid||{}).forEach(function(k){if(k.charAt(0)!=='_')paidSum+=pAmt(l,k)});
  var credit=0,covered=0,missed=0,missedList=[],short=0,next=null;
  for(var i=0;i<n&&st!=null;i++){var k=ymStr(st+i),mi=S_[i],a=pAmt(l,k)+credit;
    if(a>=mi-0.001){credit=a-mi;covered++}
    else{credit=0;if(next===null)next=k;if(i<due){missed++;missedList.push(k);short+=mi-a}}}
  var rem=Math.max(0,N(l.total)-paidSum);
  return{n:n,due:due,paid:covered,missed:missed,missedList:missedList,short:short,rem:rem,done:n>0&&rem<=0.001,next:rem<=0.001?null:next}
}
function fundCalc(){
  var inc=0,col=0,out=0;
  D.fund.forEach(function(f){inc+=N(f.amount)});
  D.loans.forEach(function(l){
    if(l.deduct!==false)out+=N(l.total);
    Object.keys(l.paid||{}).forEach(function(k){if(String(l.paid[k]).charAt(0)==='c')col+=pAmt(l,k)})
  });
  return{inc:inc,col:col,out:out,avail:inc+col-out}
}
// ---------- الحالة ----------
var S={lt:'loans',fromQ:null,mode:null,tab:'dash',q:'',collectMonth:CUR,modal:null};
if(location.hash==='#applicant')S.mode='app';
function go(t){S.tab=t;render()}
function render(){
  var a=document.getElementById('app');
  if(!S.mode){a.innerHTML=vGate();return}
  if(S.mode==='app'){a.innerHTML=vApplicant();return}
  var v={dash:vDash,loans:vLoans,collect:vCollect,remind:vRemind,fund:vFund,more:function(){return vMore()+renumCard()}}[S.tab]();
  a.innerHTML='<header><div style="display:flex;gap:10px;align-items:center"><img src="logo-light.png" alt="" style="height:42px;width:42px"><div><h1>خدمة يوحنا المعمدان</h1><small>'+(ROLE==='editor'?'لوحة الموظف':'لوحة المسؤول')+'</small></div></div>'+(ON?'<button class="l" onclick="pull()">تحديث</button> ':'')+'<button class="l" onclick="logout()">خروج</button></header><main>'+v+'</main>'+
  '<nav>'+[['dash','الرئيسية'],['loans','القروض'],['collect','التحصيل'],['remind','التذكيرات'],['fund','الدعم'],['more','المزيد']].filter(function(x){return!(ROLE==='editor'&&(x[0]==='fund'||x[0]==='more'))}).map(function(x){return'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</nav>'+
  (S.modal?S.modal:'');
}
function logout(){S.mode=null;ROLE=ON?null:'admin';PIN='';if(ON){D.loans=[];D.queue=[];D.fund=[]}location.hash='';render()}
// ---------- الدخول ----------
function vGate(){return'<div class="center"><img src="icon-192.png" alt="" style="width:120px;height:120px;border-radius:28px;margin-bottom:10px"><h1 style="color:var(--navy2)">خدمة يوحنا المعمدان</h1><p style="color:var(--mute)">اختاري نوع الدخول</p>'+
 '<div class="card"><h2>دخول الفريق</h2>'+(ON?'<div class="row" style="margin-bottom:8px"><button class="'+(S.want==='editor'?'l':'b')+'" style="flex:1" onclick="S.want=\'admin\';render()">مسؤول</button><button class="'+(S.want==='editor'?'b':'l')+'" style="flex:1" onclick="S.want=\'editor\';render()">موظف</button></div>':'')+'<input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" style="text-align:center"><p></p><button class="b" style="width:100%" onclick="adminIn()">دخول</button></div>'+
 '<div class="card"><h2>مستفيد</h2><p style="color:var(--mute)">اعرفي قسطك وأشهرك المتبقية برقم القرض</p><button class="l" style="width:100%" onclick="S.mode=\'app\';render()">دخول المستفيد</button></div></div>'}
function adminIn(){var p=document.getElementById('pin').value;
  if(!ON){if(p===D.pin){S.mode='admin';render()}else toast('الرقم السري غير صحيح');return}
  PIN=p;toast('جاري الدخول...');
  api('login',{want:S.want==='editor'?'editor':'admin'}).then(function(r){if(!r.ok){PIN='';toast('الرقم السري غير صحيح لهذا النوع من الدخول');return}ROLE=r.role;S.mode='admin';S.tab='dash';return pull().then(function(){render()})}).catch(function(){PIN='';toast('تعذر الاتصال بالخادم')})}
function lookup(){var no=g('an');if(!ON){AR=no;render();return}PIN='';api('app',{no:no,last4:g('al')}).then(function(r){AL=r.ok?r.loan:null;AR=no;render()}).catch(function(){toast('تعذر الاتصال')})}
function vMoreOn(){return'<div class="card"><h2>نسخة احتياطية</h2><p style="color:var(--mute)">البيانات محفوظة في Google Sheets وتظهر لكل الأجهزة. نزّلي نسخة للاحتفاظ بها.</p><div class="row"><button class="b" onclick="exportData()">تنزيل نسخة</button><button class="l" onclick="document.getElementById(\'imp2\').click()">استيراد بيانات قديمة (دمج)</button></div><input id="imp2" type="file" accept=".json" style="display:none" onchange="importOld(this)"></div>'+
  '<div class="card"><h2>الأرقام السرية</h2><p style="color:var(--mute)">بتتغير من ورقة Settings جوه Google Sheet: adminPin للمسؤول وeditorPin للموظف.</p></div>'+
  '<div class="card"><h2>رابط المستفيد</h2><p style="color:var(--mute)">أضيفي <b dir="ltr">#applicant</b> في نهاية رابط التطبيق ليفتح على شاشة المستفيد مباشرة، واعملي له QR.</p></div>'}
function importOld(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.loans)throw 0;if(!confirm('سيتم دمج القروض والطلبات والدعم من الملف مع البيانات الحالية. استوردي الملف مرة واحدة بس. متأكدة؟'))return;
  ['loans','queue','fund'].forEach(function(c){(d[c]||[]).forEach(function(x){x.id=uid();D[c].push(x)})});save();render();toast('تم الدمج')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}

// ---------- الرئيسية ----------
function vDash(){
  var f=fundCalc(),act=D.loans.filter(function(l){return!calc(l).done}),missed=0,dueNow=0;
  act.forEach(function(l){var c=calc(l);missed+=c.missed;dueNow+=expDue(l,CUR)});
  var remAll=0;D.loans.forEach(function(l){remAll+=calc(l).rem});
  return(ROLE==='editor'?'':'<div class="card big"><span style="color:var(--sky)">المتاح للتمويل الجديد الآن</span><div class="n">'+money(f.avail)+'</div>'+
   '<label style="color:var(--sky)">تمويل جديد بمبلغ</label><input id="chk" type="number" inputmode="numeric" placeholder="اكتبي المبلغ" oninput="chk()"><div id="chkr" style="margin-top:8px;font-weight:700"></div></div>')+
   '<div class="grid"><div class="stat"><b>'+act.length+'</b><span>قروض جارية</span></div><div class="stat"><b>'+D.loans.length+'</b><span>إجمالي القروض</span></div>'+
   '<div class="stat"><b>'+money(dueNow)+'</b><span>أقساط شهرية مستحقة</span></div><div class="stat"><b style="color:var(--bad)">'+missed+'</b><span>أقساط فائتة</span></div>'+
   '<div class="stat"><b>'+money(remAll)+'</b><span>متبقي عند المستفيدين</span></div><div class="stat"><b>'+money(f.col)+'</b><span>تم تحصيله</span></div><div class="stat"><b>'+D.queue.length+'</b><span>في قائمة الانتظار</span></div><div class="stat"><b>'+money(D.queue.reduce(function(a,q){return a+N(q.amount)},0))+'</b><span>مطلوب للمنتظرين</span></div></div>'+
   (ROLE==='editor'?'':'<div class="card" style="margin-top:12px"><h2>ملخص الرصيد</h2><table><tr><td>دعم ورصيد افتتاحي</td><td>'+money(f.inc)+'</td></tr><tr><td>أقساط محصلة</td><td>'+money(f.col)+'</td></tr><tr><td>تمويلات خارجة</td><td>−'+money(f.out)+'</td></tr><tr><th>المتاح</th><th>'+money(f.avail)+'</th></tr></table></div>')+
   (D.loans.length?'':'<div class="card">ابدئي بإضافة أول قرض من تبويب «القروض»، وسجلي الرصيد الحالي من تبويب «الدعم».</div>')
}
function chk(){var v=N(document.getElementById('chk').value),f=fundCalc().avail,r=document.getElementById('chkr');
  if(!v){r.textContent='';return}
  r.style.color=v<=f?'#7fe0b0':'#ffb3ad';r.textContent=v<=f?'ممكن، يتبقى '+money(f-v):'غير كافٍ، ينقص '+money(v-f)}
// ---------- القروض ----------
function vLoans(){
  if(S.lt==='queue')return vQueue();
  var q=S.q.trim(),list=D.loans.filter(function(l){return matchQ(l,q)&&(calc(l).done===(S.lt==='done'))});

  D.loans.forEach(function(l,i){var st=ym(l.start),n=calc(l).n;if(st==null||tv<st||tv>st+n-1||(pAmt(l,t)>=expAt(l,t)-0.001||calc(l).done))return;
    var num=waNum(l.phone),sent=l.sent&&l.sent[t];cnt++;
    rows+='<tr><td><b>'+esc(l.owner)+'</b><br><span style="color:var(--mute)">'+esc(l.phone||'بدون رقم')+'</span></td><td>'+money(expAt(l,t))+'</td><td>'+(num?'<a class="'+(sent?'l':'b')+'" style="'+(sent?'padding:8px 14px;border-radius:10px;display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--mist);color:var(--navy2)':'')+'" target="_blank" rel="noopener" href="'+waLink(l,t)+'" onclick="markSent('+i+')">'+(sent?'أُرسلت ✓':'واتساب')+'</a>':'<span class="tag bad">رقم غير صالح</span>')+'</td></tr>'});
  return'<div class="card"><label>شهر السداد المطلوب التذكير به</label><input type="month" value="'+esc(t)+'" onchange="S.rm=this.value||null;render()">'+
  '<p style="color:var(--mute);margin:8px 0 0">التذكيرات بتبدأ يوم 25 من الشهر اللي قبل شهر السداد، وبتستمر لحد آخر قسط. اللي سدد الشهر ده مش بيظهر.'+(now.getDate()<25&&!S.rm?' النهارده قبل يوم 25، فالمعروض هو الشهر الحالي.':'')+'</p></div>'+
  '<div class="card"><h2>مطلوب تذكيرهم ('+cnt+')</h2>'+(rows?'<table><tr><th>المستفيد</th><th>القسط</th><th></th></tr>'+rows+'</table>':'لا أحد مطلوب تذكيره في هذا الشهر.')+'</div>'+
  '<div class="card"><h2>نص الرسالة</h2><textarea id="mt" rows="3" '+(ON&&ROLE!=='admin'?'readonly ':'')+'oninput="D.msg=this.value;saveSoon()">'+esc(D.msg||DEFMSG)+'</textarea><p style="color:var(--mute);margin:6px 0 0">استخدمي {name} للاسم و{month} للشهر و{amount} للقسط. زرار «واتساب» يفتح المحادثة برسالة جاهزة وتضغطي إرسال.</p></div>'
}
// ---------- المزيد ----------
function vMore(){
  if(ON)return vMoreOn();
  return'<div class="card"><h2>نسخة احتياطية</h2><p style="color:var(--mute)">البيانات محفوظة على هذا الجهاز فقط. خدي نسخة بانتظام، واستخدميها لنقل البيانات لجهاز آخر.</p><div class="row"><button class="b" onclick="exportData()">تنزيل نسخة</button><button class="l" onclick="document.getElementById(\'imp\').click()">استرجاع نسخة</button></div><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(this)"></div>'+
  '<div class="card"><h2>تغيير الرقم السري</h2><input id="np" type="password" inputmode="numeric" placeholder="رقم سري جديد"><p></p><button class="b" onclick="setPin()">حفظ</button></div>'+
  '<div class="card"><h2>رابط المستفيد</h2><p style="color:var(--mute)">أضيفي <b dir="ltr">#applicant</b> في نهاية رابط التطبيق ليفتح على شاشة المستفيد مباشرة، واعملي له QR.</p></div>'
}
function exportData(){var b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='loans-backup-'+CUR+'.json';document.body.appendChild(a);a.click();a.remove()}
function importData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.loans||!d.fund)throw 0;if(confirm('سيتم استبدال البيانات الحالية. متأكدة؟')){D=d;D.queue=D.queue||[];ensureIds();save();render();toast('تم الاسترجاع')}}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function setPin(){var p=g('np');if(p.length<4){toast('الرقم السري 4 أرقام على الأقل');return}D.pin=p;save();toast('تم التغيير')}
// ---------- المستفيد ----------
var AR=null,AL=null;
function vApplicant(){
  var res='';
  if(AR!==null){
    var l=ON?AL:D.loans.filter(function(x){return x.no===AR})[0];
    if(!l)res='<div class="card">لم نجد قرضاً بهذه البيانات. راجعي رقم القرض وآخر 4 أرقام من الموبايل المسجل.</div>';
    else{var c=calc(l);res='<div class="card"><div class="loan">'+(l.photo?'<img src="'+l.photo+'" alt="">':'<div class="ph"></div>')+'<div><b>'+esc(l.owner)+'</b><br><span style="color:var(--mute)">'+esc(l.activity)+'</span></div></div>'+
     '<div class="bar"><i style="width:'+(c.n?Math.round(c.paid/c.n*100):0)+'%"></i></div><div class="grid"><div class="stat"><b>'+money(l.total)+'</b><span>إجمالي التمويل</span></div><div class="stat"><b style="font-size:14px">'+planText(l)+'</b><span>القسط الشهري</span></div>'+
     '<div class="stat"><b>'+c.paid+' من '+c.n+'</b><span>أقساط مسددة</span></div><div class="stat"><b>'+money(c.rem)+'</b><span>المتبقي</span></div></div>'+
     '<p style="color:var(--mute)">الأقساط من '+ymLabel(l.start)+' إلى '+lastMonth(l)+'</p>'+(c.done?'<p class="tag ok">تم سداد القرض بالكامل</p>':'<p>القسط القادم: <b>'+ymLabel(c.next)+'</b></p>')+
     (c.missed?'<p style="color:var(--bad)">أشهر لم تُسدد: '+c.missedList.map(ymLabel).join('، ')+' — ناقص '+money(c.short)+'</p>':'')+'</div>'}
  }
  return'<header><div style="display:flex;gap:10px;align-items:center"><img src="logo-light.png" alt="" style="height:42px;width:42px"><div><h1>خدمة يوحنا المعمدان</h1><small>شاشة المستفيد</small></div></div><button class="l" onclick="AR=null;AL=null;logout()">رجوع</button></header><main><div class="card"><label>رقم القرض</label><input id="an" inputmode="numeric">'+(ON?'<label>آخر 4 أرقام من موبايلك المسجل</label><input id="al" inputmode="numeric" maxlength="4">':'')+'<p></p><button class="b" style="width:100%" onclick="lookup()">عرض بياناتي</button></div>'+res+'</main>'
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
setInterval(function(){if(ON&&S.mode==='admin'&&ROLE&&!busy())pull()},60000);
render();
</script>
</body>
</html>
